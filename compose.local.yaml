name: kousa-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kousa
      POSTGRES_PASSWORD: kousa_local
      POSTGRES_DB: kousa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kousa -d kousa"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: kousa
      CLICKHOUSE_PASSWORD: kousa_local
      CLICKHOUSE_DB: kousa
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "kousa",
          "--password",
          "kousa_local",
          "--query",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
